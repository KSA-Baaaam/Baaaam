<!doctype html>
<html lang="ko">
  <body style="margin:0;background:#f3f8f5;font-family:Arial,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;color:#17324d;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f8f5;padding:32px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #dbe9e1;border-radius:20px;overflow:hidden;">
          <tr><td style="height:7px;background:#21a66f;"></td></tr>
          <tr><td style="padding:38px 36px 12px;text-align:center;">
            <div style="font-size:27px;font-weight:800;letter-spacing:-1px;color:#17324d;">BAAAAM</div>
            <div style="margin-top:8px;font-size:13px;font-weight:700;color:#21a66f;">재미있게 배우는 수학·과학 이야기</div>
          </td></tr>
          <tr><td style="padding:18px 36px 38px;text-align:center;">
            <h1 style="margin:0;font-size:22px;line-height:1.4;color:#17324d;">이메일을 인증해주세요</h1>
            <p style="margin:12px 0 24px;font-size:14px;line-height:1.75;color:#60758a;">BAAAAM 회원가입을 마치려면 아래 인증코드를 입력해주세요.</p>
            <div style="display:inline-block;padding:18px 24px;border-radius:14px;background:#edf9f3;color:#12845a;font-size:32px;font-weight:800;letter-spacing:9px;">{{ .Token }}</div>
            <p style="margin:24px 0 0;font-size:12px;line-height:1.7;color:#8494a3;">본인이 요청하지 않았다면 이 메일을 무시해도 됩니다.<br>인증코드는 다른 사람에게 알려주지 마세요.</p>
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
